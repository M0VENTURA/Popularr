{% extends "base.html" %}

{% block title %}Genres & Moods Analytics{% endblock %}

{% block content %}
{#
  Genres & Moods analytics — three bar lists fed by
  GET /api/analytics/genres-moods?limit=50.

  CHANGED FROM templates/pages/analytics.html:
    * the ~46-line inline <script> moved to static/js/pages/analytics.js
    * the ~67-line inline <style> block moved to static/css/analytics.css
    * nothing else — the three cards and their ids are unchanged, and the script
      still runs on DOMContentLoaded and finds them by id:
        #genresBars #moodsBars #combosBars   the bar containers
        #genresCount #moodsCount #combosCount   the header badges
#}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-bar-chart-line"></i> Genres &amp; Moods Analytics</h1>
            <p class="text-muted mb-0">Top 50 genres, moods, and genre+mood combinations in your library.</p>
        </div>
        <a class="btn btn-outline-secondary" href="/dashboard">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="row g-4">
        <div class="col-12 col-xl-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-vinyl"></i> Top Genres</h5>
                    <span class="badge bg-primary" id="genresCount">0</span>
                </div>
                <div class="card-body">
                    <div id="genresBars" class="bar-list"></div>
                </div>
            </div>
        </div>

        <div class="col-12 col-xl-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-emoji-smile"></i> Top Moods</h5>
                    <span class="badge bg-secondary" id="moodsCount">0</span>
                </div>
                <div class="card-body">
                    <div id="moodsBars" class="bar-list"></div>
                </div>
            </div>
        </div>

        <div class="col-12 col-xl-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-intersect"></i> Top Genre × Mood</h5>
                    <span class="badge bg-success" id="combosCount">0</span>
                </div>
                <div class="card-body">
                    <div id="combosBars" class="bar-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{#
  base.html already loads utils/* and ui/toast.js. This page adds only its
  controller and stylesheet.

    js/pages/analytics.js   renderBars() + loadAnalytics() (runs on
                            DOMContentLoaded)
#}
<link rel="stylesheet" href="{{ versioned_static('css/analytics.css') }}">
<script src="{{ versioned_static('js/pages/analytics.js') }}"></script>
{% endblock %}
