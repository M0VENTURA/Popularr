<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Popularr Dashboard{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% set dist = url_for('static', filename='dist') %}
  {% if config.get('features', {}).get('use_local_assets', False) %}
  <link href="{{ dist }}/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="{{ dist }}/vendor/bootstrap-icons.css" rel="stylesheet">
  {% else %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  {% endif %}

  <link rel="stylesheet" href="{{ versioned_static('css/popularr.css') }}">

  {#
    The navbar layout rules that used to live in an inline <style> block here
    now sit in popularr.css under "Navbar Layout". They were tightly coupled
    to --navbar-height (which popularr.css owns), so splitting them across two
    files meant a change to one could silently invalidate the other.
  #}
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm" style="background-color: var(--primary-bg);">
    <div class="container-fluid flex-wrap flex-lg-nowrap align-items-center">

      <!-- Brand & Mobile Toggles -->
      <div class="nav-brand-row d-flex align-items-center justify-content-between">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('ui.dashboard') }}">
          <i class="bi bi-music-note-beamed text-success"></i> Popularr
        </a>
        <div class="d-flex align-items-center gap-3 d-lg-none">
          <a href="/config" class="text-muted text-decoration-none" aria-label="Settings" title="Settings">
            <i class="bi bi-gear fs-5"></i>
          </a>
          <button class="navbar-toggler border-0 px-1 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
      </div>

      <!-- Persistent Global Search Bar -->
      <div class="nav-search-wrapper" id="navSearchForm" title="Search library or MusicBrainz (Ctrl+K)">
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-search"></i></span>
          <input type="text" id="navSearchInput" class="form-control bg-dark text-light border-secondary shadow-none"
                 placeholder="Search library or MusicBrainz…" autocomplete="off" aria-label="Search library or MusicBrainz"
                 aria-keyshortcuts="Control+K Meta+K"
                 onfocus="openUnifiedSearch();this.select();"
                 oninput="syncNavSearchQuery()">
          {# The shortcut hint is a SIBLING of the input inside the input-group,
             not positioned over it: an absolutely-positioned overlay would sit
             on top of the text the user is typing. `d-none d-lg-flex` hides it
             wherever the navbar is tight — below lg the search row wraps and
             the badge would crowd the input it labels. #}
          <span class="input-group-text bg-dark border-secondary text-muted search-kbd-hint d-none d-lg-flex align-items-center"
                id="navSearchKbdHint" title="Press Ctrl+K (⌘K on Mac) to search" aria-hidden="true">
            <kbd class="search-kbd" id="navSearchKbd">Ctrl</kbd><kbd class="search-kbd">K</kbd>
          </span>
          <button class="btn btn-outline-secondary btn-sm" type="button" title="Search" aria-label="Search" onclick="openUnifiedSearch()">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>

      <!-- Navigation Links -->
      <div class="collapse navbar-collapse nav-links-wrapper" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center" style="gap: 0.15rem;">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('ui.dashboard') }}">
              <i class="bi bi-speedometer2"></i> <span class="d-lg-none d-xl-inline">Dashboard</span>
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="artistsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-people"></i> <span class="d-lg-none d-xl-inline">Artists</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li><a class="dropdown-item" href="{{ url_for('ui.artists') }}"><i class="bi bi-people me-2"></i> All Artists</a></li>
              <li><a class="dropdown-item" href="{{ url_for('ui.bookmarks') }}?filter=artist"><i class="bi bi-star-fill text-warning me-2"></i> Favourite Artists</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="{{ url_for('ui.correcting') }}"><i class="bi bi-tools me-2"></i> Tag Corrections</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="/downloads/monitor#folderGroupsSection"><i class="bi bi-download"></i> <span class="d-lg-none d-xl-inline">Downloads</span></a></li>
          <li class="nav-item"><a class="nav-link" href="/playlists"><i class="bi bi-collection-play"></i> <span class="d-lg-none d-xl-inline">Playlists</span></a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="discoverDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-compass"></i> <span class="d-lg-none d-xl-inline">Discover</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li><a class="dropdown-item" href="/discover"><i class="bi bi-compass me-2"></i> Discover</a></li>
              <li><a class="dropdown-item" href="/downloads/discover/upcoming"><i class="bi bi-calendar-event me-2"></i> Upcoming Releases</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="/missing"><i class="bi bi-exclamation-circle text-warning"></i> <span class="d-lg-none d-xl-inline">Missing</span></a></li>

          {% if custom_bookmark_links and custom_bookmark_links|length > 0 %}
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="bookmarksDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-bookmark-star"></i> <span class="d-lg-none d-xl-inline">Bookmarks</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark">
              {% for link in custom_bookmark_links %}
              <li><a class="dropdown-item" href="{{ link.url }}" target="_blank" rel="noopener noreferrer"><i class="bi bi-link-45deg me-2"></i> {{ link.title }}</a></li>
              {% endfor %}
            </ul>
          </li>
          {% endif %}

          {#
            SYSTEM MENU — Logs / Help / Config / Tag Corrections.

            These were four separate top-level items (three icon-only links plus
            "Tag Corrections" buried in the Artists dropdown), which made eleven
            entries in one navbar. Between the lg and xl breakpoints every label
            is hidden (`d-lg-none d-xl-inline`), so the icon-only items sat next
            to unlabelled primary links with nothing to distinguish a page from a
            utility — the crowding reported on 1024px–1280px viewports.

            Folding them into one dropdown keeps every destination reachable
            while removing three icons from the bar. `Tag Corrections` is listed
            here as well as in the Artists menu on purpose: it is genuinely both,
            and the Artists menu is where returning users look for it.

            Keep the user menu for account-scoped actions only.  #}
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="systemDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-gear-wide-connected"></i> <span class="d-none d-xl-inline">System</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end" aria-labelledby="systemDropdown">
              <li><a class="dropdown-item" href="{{ url_for('ui.logs') }}"><i class="bi bi-file-text me-2"></i> Logs</a></li>
              <li><a class="dropdown-item" href="{{ url_for('ui.correcting') }}"><i class="bi bi-tools me-2"></i> Tag Corrections</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="{{ url_for('ui.help_page') }}"><i class="bi bi-question-circle me-2"></i> Help</a></li>
              <li><a class="dropdown-item" href="{{ url_for('ui.config_editor') }}"><i class="bi bi-gear me-2"></i> Config</a></li>
            </ul>
          </li>

          {% if session.get('username') %}
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle"></i> <span class="d-lg-none d-xl-inline">{{ session.get('username') }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
              <li><a class="dropdown-item text-danger" href="{{ url_for('ui.logout') }}"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
            </ul>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  {#
    No inline `style="padding-top: 6rem"` here any more.

    6rem (96px) was a THIRD hard-coded navbar height, alongside the 68px
    token in popularr.css and the 112px fallback in dashboard.css. Because an
    inline style outranks any normal stylesheet rule, the 6rem always won and
    the --navbar-height token had no effect at all — which is why content sat
    too low on desktop and the search flyout did not line up with the navbar.

    popularr.css now sets
        padding-top: calc(var(--navbar-height) + 0.75rem)
    and the script at the end of this file measures the real navbar and writes
    that token, so the spacing is exact at every breakpoint.
  #}
  <main class="container-fluid">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% include 'layouts/_flash_messages.html' ignore missing %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="detailSlideOver" style="width: 100%; max-width: 600px; background-color: var(--secondary-bg);">
    <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
      <h5 class="offcanvas-title text-truncate" id="slideOverTitle">Loading...</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0" id="slideOverContent">
      <div class="d-flex justify-content-center align-items-center h-100">
        <div class="spinner-border text-primary"></div>
      </div>
    </div>
  </div>

  {#
    GLOBAL SEARCH MODALS — included ONCE, here, for every page.

    _musicbrainz_search_modal.html wraps
    components/_musicbrainz_search_component.html, which renders fixed ids
    (mbSearchArtist, mbSearchResults, mbSelectedRelease, ...).
    `performMbSearch()` resolves those with document.getElementById(), which
    returns the FIRST match in DOM order — i.e. the copy below.

    Any page that includes the component again therefore ends up with the
    search writing results into THIS hidden modal while the visible one shows
    its empty placeholder. Do not include the component anywhere else; call
    openGlobalMbSearch(artist, album, callback) instead.

    These wrappers are `display: contents` in popularr.css so they do not
    become empty flex items in the body's column layout.
  #}
  <div id="global-mb-search-container">
      {% include 'components/_musicbrainz_search_modal.html' ignore missing %}
  </div>

  <div id="global-unified-search-container">
      {% include 'components/_unified_search_modal.html' ignore missing %}
  </div>

  {#
    GLOBAL PLAYER BAR

    This is a FLEX FOOTER ITEM of <body>, not an overlay. That is what makes
        body.player-visible { --footer-stack-height: status + player }
    correct, and it is why .sticky-save-bar sits above the player instead of
    behind it.

    The inline `position: fixed; bottom: 0; left: 0; right: 0; z-index: 1030`
    that used to be here detached the bar from the flex column, so the footer
    stack maths silently went wrong and the bar overlaid page content.

    popularr.css sets `position: relative` — NOT `static`. #playerQueuePanel
    below is `position: absolute; bottom: 100%`, so it needs the bar to remain
    a positioning context; `static` would let the Up Next panel escape to the
    viewport. Only the visual styling is kept inline here.
  #}
  <div id="globalPlayerBar" class="d-none" style="background:rgba(18,18,18,0.97); border-top:1px solid var(--border-color); backdrop-filter:blur(10px); padding:0.5rem 1rem; box-shadow:0 -4px 16px rgba(0,0,0,0.5);">
    <audio id="globalAudioEl" preload="none"></audio>

    <div id="playerQueuePanel" class="d-none">
      <div class="d-flex justify-content-between align-items-center px-1 mb-2 border-bottom border-secondary pb-2">
        <small class="text-muted fw-bold text-uppercase"><i class="bi bi-list-ul me-1"></i>Up Next <span id="playerQueueCount" class="badge bg-secondary ms-1">0</span></small>
        <button type="button" class="btn btn-sm btn-outline-secondary py-0" id="playerQueueClear" title="Clear queue"><i class="bi bi-eraser-fill"></i> Clear</button>
      </div>
      <div id="playerQueueList" class="d-flex flex-column gap-1" style="max-height: 220px; overflow-y: auto; scrollbar-width: thin;"></div>
    </div>

    <div class="d-flex align-items-center gap-2 gap-md-3" style="max-width:1400px; margin:0 auto;">
      <img id="playerArt" src="" alt="Album art" class="shadow-sm" style="width:48px;height:48px;object-fit:cover;border-radius:6px;flex-shrink:0;display:none;cursor:pointer;" title="Show queue" onclick="Player.toggleQueue()">

      <div class="flex-grow-1 min-w-0" style="cursor:pointer;" title="Show queue" onclick="Player.toggleQueue()">
        <div id="playerTitle" class="text-truncate fw-bold text-light" style="font-size:0.9rem;line-height:1.2;"></div>
        <div id="playerArtist" class="text-truncate text-muted" style="font-size:0.8rem;"></div>
      </div>

      {# 44px, not 32px: these are the most-tapped controls in the app and 32px
         is below the minimum comfortable touch target. #}
      <div class="d-flex align-items-center gap-2 flex-shrink-0 mx-auto">
        <button id="playerPrev" class="btn btn-sm btn-dark border-secondary rounded-circle d-flex align-items-center justify-content-center" title="Previous" style="width: 44px; height: 44px;"><i class="bi bi-skip-start-fill"></i></button>
        <button id="playerPlayPause" class="btn btn-sm btn-success rounded-circle d-flex align-items-center justify-content-center shadow-sm" title="Play" style="width: 44px; height: 44px;"><i class="bi bi-play-fill fs-5" style="margin-left: 2px;"></i></button>
        <button id="playerNext" class="btn btn-sm btn-dark border-secondary rounded-circle d-flex align-items-center justify-content-center" title="Next" style="width: 44px; height: 44px;"><i class="bi bi-skip-end-fill"></i></button>
      </div>

      <div class="d-none d-md-flex flex-grow-1 align-items-center gap-2 ms-3">
        <small id="playerCurrentTime" class="text-muted font-monospace flex-shrink-0" style="font-size:0.75rem; width: 35px; text-align:right;">0:00</small>
        <div id="playerProgress" class="flex-grow-1" role="progressbar" style="height:6px;background:var(--tertiary-bg);border-radius:3px;cursor:pointer;overflow:hidden;">
          <div id="playerProgressBar" style="height:100%;width:0%;background:var(--spotify-green);border-radius:3px;transition:width 0.25s linear;pointer-events:none;"></div>
        </div>
        <small id="playerTotalTime" class="text-muted font-monospace flex-shrink-0" style="font-size:0.75rem; width: 35px;">0:00</small>
      </div>

      <div class="d-none d-lg-flex align-items-center gap-2 flex-shrink-0 border-start border-secondary ps-3">
        <i class="bi bi-volume-up text-muted" style="font-size:1rem;"></i>
        <input id="playerVolume" type="range" min="0" max="1" step="0.05" value="1" style="width:80px;height:6px;accent-color:var(--spotify-green);" title="Volume" aria-label="Volume">
        <button id="playerQueueToggle" class="btn btn-sm btn-dark border-secondary ms-2" title="Show queue"><i class="bi bi-list-ul"></i></button>
        <button id="playerStop" class="btn btn-sm btn-outline-danger border-0" title="Stop &amp; close player"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>
  </div>

  {% if config.get('features', {}).get('use_local_assets', False) %}
  <script src="{{ dist }}/vendor/bootstrap.bundle.min.js"></script>
  {% else %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% endif %}

  <div id="scanStatusBar" role="button" tabindex="0" onclick="openUnifiedLogModal()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openUnifiedLogModal();}" title="Open scanning log">
    <span id="scanStatusIcon" class="scan-status-idle"><i class="bi bi-circle"></i></span>
    <span id="scanQueueSummary" class="scan-queue-summary d-none"></span>
    <span id="scanStatusLine" class="text-truncate">Idle</span>
    <span class="scan-status-open"><i class="bi bi-terminal"></i> Log</span>
  </div>

  <div class="modal fade modal-fullscreen" id="unifiedLogModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content bg-dark">
        <div class="modal-header py-2 px-3 border-secondary d-flex flex-column align-items-stretch gap-2" style="background: var(--tertiary-bg);">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h6 class="modal-title mb-0 fw-bold"><i class="bi bi-terminal text-info me-2"></i> System Logs</h6>
            <div class="d-flex gap-2 align-items-center log-toolbar">
              <button type="button" class="btn btn-sm btn-outline-success py-0" onclick="downloadActiveLogLastHour()" title="Export last 60 minutes">
                <i class="bi bi-download"></i> <span class="d-none d-sm-inline">Last 1hr</span>
              </button>
              <button id="clearLogBtn" type="button" class="btn btn-outline-secondary btn-sm py-0" onclick="clearUnifiedLog()" title="Clear active log">
                <i class="bi bi-eraser"></i> <span class="d-none d-sm-inline">Clear</span>
              </button>
              <button id="pauseLogBtn" type="button" class="btn btn-outline-secondary btn-sm py-0" onclick="toggleLogPause()"><i class="bi bi-pause"></i> <span class="d-none d-sm-inline">Pause</span></button>
              <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
          </div>
          <div class="d-flex align-items-center gap-1 overflow-x-auto pb-1 flex-nowrap" style="scrollbar-width: none;">
            <button type="button" class="btn btn-sm btn-dark border-secondary log-source-tab active" data-source="scanner" onclick="switchLogSource('scanner')"><i class="bi bi-lightning-charge me-1"></i>Scanner</button>
            <button type="button" class="btn btn-sm btn-dark border-secondary log-source-tab" data-source="queue" onclick="switchLogSource('queue')"><i class="bi bi-list-task me-1"></i>Queue</button>
            <button type="button" class="btn btn-sm btn-dark border-secondary log-source-tab" data-source="soulseek" onclick="switchLogSource('soulseek')"><i class="bi bi-search me-1"></i>Soulseek</button>
            <button type="button" class="btn btn-sm btn-dark border-secondary log-source-tab" data-source="navidrome" onclick="switchLogSource('navidrome')"><i class="bi bi-cloud-arrow-down me-1"></i>Navidrome</button>
            <button type="button" class="btn btn-sm btn-dark border-secondary log-source-tab" data-source="system" onclick="switchLogSource('system')"><i class="bi bi-gear me-1"></i>System</button>
          </div>
        </div>

        <div class="modal-body p-0 d-flex flex-column" style="background: #111;">
          <div class="d-flex align-items-center justify-content-between p-2" style="background: #1a1a1a; border-bottom: 1px solid #333;">
            <small class="text-muted fw-bold text-uppercase"><i class="bi bi-broadcast me-1"></i>Live stream</small>
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" id="logTimestampToggle" onchange="toggleLogTimestamps(this.checked)">
              <label class="form-check-label small text-muted ms-1" for="logTimestampToggle">Timestamps</label>
            </div>
          </div>
          <pre id="unifiedLog" class="p-3 mb-0 flex-grow-1 text-light" style="max-height: none; height: 100%; overflow-y: auto; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.4; background: transparent;"></pre>
        </div>
      </div>
    </div>
  </div>

  {#
    --navbar-height is kept in sync by syncNavbarHeight() in static/js/main.js,
    which measures the real navbar with a ResizeObserver and also re-measures
    on shown/hidden.bs.collapse when the mobile menu expands.

    Do NOT add a second copy of that logic here. Two writers for one CSS
    variable is exactly how the 68px / 96px / 112px disagreement started.
  #}

  {#
    SHARED FRAMEWORK — every file below is a dependency of at least one
    script that ALSO loads on every page (ui/player.js, main.js,
    ui/search-flyout.js, and the global MusicBrainz modal driven by
    services/musicbrainz-picker.js). Order matters and mirrors each file's
    own "Load order" header comment:

      utils/*        no dependencies — must load first
      ui/*           depend on utils/*, and confirm.js additionally on
                     modal.js, so modal.js must precede it
      services/musicbrainz-picker.js
                     drives the #musicBrainzModal that
                     components/_musicbrainz_search_modal.html renders
                     below. Called via openGlobalMbSearch(artist, album, cb)
                     from album_detail.html, missing_releases.html and
                     track_detail.html (NOT from navSearchInput's own
                     onfocus — that calls openUnifiedSearch(), a different
                     flow driven by ui/search-flyout.js).

    pages/folder-groups.js WAS in this list and has been REMOVED.
    It was the legacy "green folders" view for MusicBrainz releases, and it
    could never do anything: it rendered into #folderGroupsList, the same
    element pages/download-queue.js::renderQueueSection() now owns, and it
    stood down whenever global.loadQueueStatus existed. Worse, on every page
    that does NOT load download-queue.js (dashboard, album, artists, config,
    …) nothing made it stand down, so its DOMContentLoaded handler started a
    5-second poller that ticked a no-op load() forever. Its only useful
    export, the /api/downloads/folder-groups view, is superseded by
    pages/monitor.js's Matched & Unmatched Folders. File deleted too.

    Verified against the actual call sites (not assumed): main.js calls
    global.ui.confirm(...), which only exists once ui/confirm.js has loaded;
    ui/search-flyout.js calls global.api / global.buttonState / global.toast.

    ui/status-badge.js is DELIBERATELY NOT in this list — grepped every file
    below and none of them call it. It is used by pages/dashboard.js,
    pages/download-queue.js, pages/monitor.js and pages/playlist.js, so
    those four page templates load it themselves via {% block scripts %}
    (see each page's own script block). Loading it globally would have cost
    every other page a request for code they never call.

    Page templates only need to add page-specific scripts (pages/*.js,
    services/genres.js, services/slskd.js, services/musicbrainz-queue.js,
    features/csv-import.js, state/import-state.js) via {% block scripts %}.
    They do NOT need to repeat anything in this list.
  #}
  <script src="{{ versioned_static('js/utils/dom.js') }}"></script>
  <script src="{{ versioned_static('js/utils/api.js') }}"></script>
  <script src="{{ versioned_static('js/utils/poller.js') }}"></script>
  {#
    Artist filing (global.artistNames). Loaded here rather than per page because
    BOTH the global search flyout below and the page modules use it, and the
    server files the /artists sections by the same rules — the two must agree.
  #}
  <script src="{{ versioned_static('js/utils/artist-names.js') }}"></script>

  <script src="{{ versioned_static('js/ui/toast.js') }}"></script>
  <script src="{{ versioned_static('js/ui/modal.js') }}"></script>
  <script src="{{ versioned_static('js/ui/confirm.js') }}"></script>
  <script src="{{ versioned_static('js/ui/button-state.js') }}"></script>
  {#
    Compact centred "working…" popup. Loaded globally (not per page) because
    queueing and MusicBrainz lookups happen from several pages, and it must be
    available wherever those buttons live. Distinct from button-state.js: that
    spins the clicked button, this shows a popup for actions that have no
