{# 
  Reusable scan type dropdown selector.
  Usage:
    {% include 'components/_scan_selector.html' %}
    
  The parent form must provide the hidden fields (artist, album, etc.)
  and the force checkbox separately because those vary per page.
#}
<select name="scan_type" class="form-select form-select-sm" style="min-width: 140px; width: auto;" title="Select scan type">
    <option value="full">Full</option>
    <option value="navidrome">Navidrome</option>
    <option value="popularity">Popularity</option>
    <option value="metadata">Metadata</option>
    <option value="genres">Genres</option>
    <option value="singles">Singles</option>
    <option value="essentia">Essentia</option>
</select>
<label class="form-check form-check-inline mb-0 ms-1" title="Restart from the beginning (a plain restart skips recently-scanned items; with Force it re-scans everything)">
  <input class="form-check-input" type="checkbox" name="restart" value="1">
  <span class="form-check-label small">Restart</span>
</label>
