<!-- MusicBrainz Lookup Form -->
<div class="card mb-4 shadow-sm border-info" id="lookupCard">
  <div class="card-header py-2 d-flex justify-content-between align-items-center">
    <h6 class="mb-0"><i class="bi bi-search"></i> MusicBrainz Lookup</h6>
    <small class="text-muted">Search for releases to download</small>
  </div>
  <div class="card-body py-3">
    <form onsubmit="event.preventDefault(); doLookup()">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-sm-6 col-md-3">
          <label class="form-label form-label-sm mb-1" for="lookupArtist">Artist</label>
          <input type="text" class="form-control form-control-sm" id="lookupArtist" placeholder="Artist name">
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <label class="form-label form-label-sm mb-1" for="lookupAlbum">Album</label>
          <input type="text" class="form-control form-control-sm" id="lookupAlbum" placeholder="Album name">
        </div>
        <div class="col-6 col-sm-4 col-md-2">
          <label class="form-label form-label-sm mb-1" for="lookupTrack">Track</label>
          <input type="text" class="form-control form-control-sm" id="lookupTrack" placeholder="Track title">
        </div>
        <div class="col-6 col-sm-4 col-md-1">
          <label class="form-label form-label-sm mb-1" for="lookupYear">Year</label>
          <input type="text" class="form-control form-control-sm" id="lookupYear" placeholder="2024" maxlength="4">
        </div>
        <div class="col-12 col-sm-4 col-md-3 d-flex gap-2">
          <button type="submit" class="btn btn-info btn-sm flex-grow-1">
            <i class="bi bi-search"></i> Search
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="clearLookup()" title="Clear">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
